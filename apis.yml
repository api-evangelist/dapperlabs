name: Dapperlabs
description: >-
  Dapper Labs is a Vancouver-based blockchain company (originally spun out of
  Axiom Zen) that builds consumer crypto and NFT experiences and the developer
  platform behind them. It created the Flow blockchain, CryptoKitties, and the
  Dapper Wallet, and operates licensed digital-collectible marketplaces
  including NBA Top Shot, NFL All Day, LaLiga Golazos, UFC Strike, and Disney
  Pinnacle. Its developer surface ("Dapper Core") exposes Cadence smart
  contracts, the Dapper Wallet / Dapper Connect authentication flow, and Flow
  blockchain SDKs so third parties can build on top of Dapper's collectibles and
  on-chain assets rather than through a traditional REST/OpenAPI API.
